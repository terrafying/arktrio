name: Performance Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install locust pytest-benchmark pytest-asyncio aiohttp
    
    - name: Start Test Environment
      run: |
        docker-compose -f docker-compose.test.yml up -d
        sleep 30  # Wait for services to be ready
    
    - name: Run Load Tests
      run: |
        locust -f tests/performance/locustfile.py --headless -u 100 -r 10 --run-time 1m --host http://localhost:8080
      env:
        LOCUST_CSV: performance-results
    
    - name: Run Benchmark Tests
      run: |
        pytest tests/performance/benchmark.py --benchmark-only --benchmark-json=benchmark-results.json
    
    - name: Generate Performance Report
      run: |
        python scripts/generate_performance_report.py \
          --locust-results performance-results \
          --benchmark-results benchmark-results.json \
          --output performance-summary.md
    
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('performance-summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
    
    - name: Upload Performance Results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          performance-results
          benchmark-results.json
          performance-summary.md
    
    - name: Cleanup
      if: always()
      run: docker-compose -f docker-compose.test.yml down 