arktrio {
  center {
    static {
      host = "0.0.0.0"
      port = 2236
      logLevel = "Info"
      logLevelColor = true
      runIdPrefix = "run"
      
      // Three core components
      components {
        messaging {
          enabled = true
          batchSize = 3
          timeout = 5s
        }
        monitoring {
          enabled = true
          interval = 3s
          retention = 5h
        }
        persistence {
          enabled = true
          checkpointInterval = 3m
          maxRetries = 5
        }
      }
      
      // Five operational modes
      modes {
        development {
          enabled = true
          debug = true
        }
        testing {
          enabled = true
          mock = true
        }
        staging {
          enabled = true
          validation = true
        }
        production {
          enabled = true
          optimization = true
        }
        maintenance {
          enabled = false
          readonly = true
        }
      }
    }
  }
  
  edge {
    static {
      host = "0.0.0.0"
      port = 2237
      logLevel = "Info"
      logLevelColor = true
      edgeIdPrefix = "edge"
      
      // Three synchronization strategies
      sync {
        immediate {
          enabled = true
          timeout = 3s
        }
        batched {
          enabled = true
          batchSize = 5
          interval = 3s
        }
        lazy {
          enabled = true
          threshold = 5
          maxDelay = 3m
        }
      }
      
      // Five connection states
      connection {
        states {
          disconnected {
            retryInterval = 3s
            maxRetries = 5
          }
          connecting {
            timeout = 3s
          }
          connected {
            heartbeat = 5s
          }
          degraded {
            threshold = 3
            timeout = 5s
          }
          failed {
            backoff = 3s
            maxAttempts = 5
          }
        }
      }
    }
  }
}
