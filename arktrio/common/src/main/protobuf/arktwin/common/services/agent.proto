syntax = "proto3";

package arktwin.common.services;

import "google/protobuf/empty.proto";
import "scalapb/scalapb.proto";
import "validate/validate.proto";
import "arktwin/common/data/timestamp.proto";

option (scalapb.options) = {
  scope: PACKAGE
  preserve_unknown_fields: false
};

// Agent capabilities and roles
enum AgentCapability {
  AGENT_CAPABILITY_UNSPECIFIED = 0;
  AGENT_CAPABILITY_CODE_ANALYSIS = 1;
  AGENT_CAPABILITY_REASONING = 2;
  AGENT_CAPABILITY_PLANNING = 3;
  AGENT_CAPABILITY_EXECUTION = 4;
  AGENT_CAPABILITY_MEMORY = 5;
  AGENT_CAPABILITY_LEARNING = 6;
}

// Agent state and configuration
message AgentConfig {
  string agent_id = 1 [(validate.rules).string.min_len = 1];
  repeated AgentCapability capabilities = 2;
  map<string, string> parameters = 3;
  string model_name = 4;
  float temperature = 5;
  int32 max_tokens = 6;
}

// Task definition for agents
message AgentTask {
  string task_id = 1 [(validate.rules).string.min_len = 1];
  string description = 2 [(validate.rules).string.min_len = 1];
  repeated AgentCapability required_capabilities = 3;
  map<string, string> context = 4;
  arktwin.common.data.Timestamp deadline = 5;
}

// Agent response and results
message AgentResponse {
  string task_id = 1 [(validate.rules).string.min_len = 1];
  string agent_id = 2 [(validate.rules).string.min_len = 1];
  string content = 3;
  repeated string references = 4;
  map<string, string> metadata = 5;
  arktwin.common.data.Timestamp timestamp = 6;
}

// Service definition for agent communication
service AgentService {
  // Register a new agent with its capabilities
  rpc RegisterAgent(AgentConfig) returns (google.protobuf.Empty);
  
  // Submit a task for processing
  rpc SubmitTask(AgentTask) returns (stream AgentResponse);
  
  // Get available agents matching capabilities
  rpc GetAvailableAgents(AgentTask) returns (stream AgentConfig);
  
  // Stream agent responses for a specific task
  rpc StreamTaskResponses(AgentTask) returns (stream AgentResponse);
} 