version: '3.8'

services:
  arktrio-center:
    build:
      context: .
      dockerfile: docker/center.dockerfile
    ports:
      - "2236:2236"
    environment:
      - ARKTRIO_CENTER_STATIC_HOST=0.0.0.0
      - ARKTRIO_CENTER_STATIC_PORT=2236
      - ARKTRIO_CENTER_STATIC_LOG_LEVEL=Info
      - ARKTRIO_CENTER_STATIC_LOG_LEVEL_COLOR=true
    volumes:
      - ./center.conf:/etc/opt/arktrio/center.conf
    networks:
      - arktrio-network

  arktrio-edge:
    build:
      context: .
      dockerfile: docker/edge.dockerfile
    ports:
      - "2237:2237"
    environment:
      - ARKTRIO_CENTER_STATIC_HOST=arktrio-center
      - ARKTRIO_CENTER_STATIC_PORT=2236
      - ARKTRIO_EDGE_STATIC_HOST=0.0.0.0
      - ARKTRIO_EDGE_STATIC_PORT=2237
      - ARKTRIO_EDGE_STATIC_LOG_LEVEL=Info
      - ARKTRIO_EDGE_STATIC_LOG_LEVEL_COLOR=true
    volumes:
      - ./edge.conf:/etc/opt/arktrio/edge.conf
    networks:
      - arktrio-network
    depends_on:
      - arktrio-center

  arktrio-seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - CONFIG_FORCE_akka_remote_artery_canonical_hostname=seed
      - CONFIG_FORCE_akka_remote_artery_canonical_port=2551
      - CONFIG_FORCE_akka_management_http_hostname=seed
      - CONFIG_FORCE_akka_management_http_port=8558
      - CONFIG_FORCE_akka_management_http_bind_hostname=0.0.0.0
      - CONFIG_FORCE_akka_management_http_bind_port=8558
    ports:
      - "2551:2551"
      - "8558:8558"
      - "8080:8080"
    networks:
      - mesh-network

  arktrio-node1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - CONFIG_FORCE_akka_remote_artery_canonical_hostname=node1
      - CONFIG_FORCE_akka_remote_artery_canonical_port=2551
      - CONFIG_FORCE_akka_management_http_hostname=node1
      - CONFIG_FORCE_akka_management_http_port=8558
      - CONFIG_FORCE_akka_management_http_bind_hostname=0.0.0.0
      - CONFIG_FORCE_akka_management_http_bind_port=8558
      - CONFIG_FORCE_akka_cluster_seed_nodes_0=akka://arktrio-mesh@seed:2551
    depends_on:
      - arktrio-seed
    networks:
      - mesh-network

  arktrio-node2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - CONFIG_FORCE_akka_remote_artery_canonical_hostname=node2
      - CONFIG_FORCE_akka_remote_artery_canonical_port=2551
      - CONFIG_FORCE_akka_management_http_hostname=node2
      - CONFIG_FORCE_akka_management_http_port=8558
      - CONFIG_FORCE_akka_management_http_bind_hostname=0.0.0.0
      - CONFIG_FORCE_akka_management_http_bind_port=8558
      - CONFIG_FORCE_akka_cluster_seed_nodes_0=akka://arktrio-mesh@seed:2551
    depends_on:
      - arktrio-seed
    networks:
      - mesh-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - mesh-network

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mesh-network

networks:
  arktrio-network:
    driver: bridge
  mesh-network:
    driver: bridge 