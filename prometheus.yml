global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mesh-nodes'
    static_configs:
      - targets:
        - 'seed:8558'
        - 'node1:8558'
        - 'node2:8558'
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] 